name: Transfer tested optional-layout patch
on:
  push:
    branches: [work/optional-layout-transfer]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 052862fa3aa1c8f36098e307be75fef70b28a40b
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply checksum-verified source patch
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, subprocess
          payload = ''''''
          patch = gzip.decompress(base64.b64decode(payload))
          assert hashlib.sha256(patch).hexdigest() == 'eb93b3aae09504cdcf9e5379e60e09ee663b5256848bf4befb3f5e6dea178f02'
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          PY
      - run: npm test
      - name: Push only the new review branch
        run: |
          test -z "$(git ls-remote --heads origin refs/heads/feat/optional-overlap-layout)"
          git config user.name 'Berkay'
          git config user.email '74908168+Berkopan@users.noreply.github.com'
          git commit -m 'feat: keep classic layout by default and make overlap routing opt-in'
          git push origin HEAD:refs/heads/feat/optional-overlap-layout
