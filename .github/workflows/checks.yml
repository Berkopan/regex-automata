name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Engine, localization, and both layout modes
        run: npm test
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Chromium interactions and SVG geometry
        run: python -m unittest discover -s tests -p '*browser.py' -v
      - name: Verify immutable PR preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tests/preview.py
      - name: Screenshots and SVG exports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          retention-days: 7
          path: test-results/
      - name: Tested source and static preview
        uses: actions/upload-artifact@v4
        with:
          name: regex-automata-preview
          retention-days: 7
          path: |
            index.html
            styles.css
            src/
            tests/
            package.json
